AutoName: Overlord
Summary: Post-apocalyptic wasteland expedition & scavenger management RPG
Description: |-
  Take command of Vault Bunker 42 in a retro-terminal post-apocalyptic wasteland expedition RPG.

  Manage your roster of scavengers, equip them with makeshift weapons, armor, and medkits, and dispatch them into the irradiated ruins. Monitor their live terminal feeds as they face environmental hazards, encounter hostile mutants, loot scrap metal, and fight for survival.

  Features:
  * Retro Terminal UI: Atmospheric CRT-styled green phosphor terminal aesthetic.
  * Dynamic Wasteland Expeditions: Time-based exploration with random encounters, combat, and rare loot drops.
  * Equipment & Gear Tiers: Weapons and armor from makeshift scrap to pre-war relics.
  * 100% Free & Open Source: No ads, no analytics, no tracking, and no internet required.

